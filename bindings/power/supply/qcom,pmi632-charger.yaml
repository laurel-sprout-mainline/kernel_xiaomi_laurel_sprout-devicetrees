%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,pmi632-charger.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI632 Switch-Mode Battery Charger

maintainers:
  - Marc Lainez <marc.lainez@gmail.com>

description:
  The SMB5 charger block in the Qualcomm PMI632 PMIC provides USB charging
  with automatic power source detection (APSD), input current limiting
  (AICL), and hardware-based JEITA temperature compliance. It supports
  SDP, CDP and DCP sources. Float/unclassified sources use the conservative
  current limit. Optional QC2/QC3 negotiation is bounded to 9 V and 18 W.

allOf:
  - if:
      required: [qcom,enable-hvdcp]
    then:
      required: [dpdm-supply]

properties:
  dpdm-supply:
    description: PHY line-ownership regulator for charger detection.

  qcom,enable-hvdcp:
    type: boolean
    description: Enable bounded QC2/QC3 negotiation, requiring PHY DPDM control.

  qcom,parallel-charger:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: SMB1355 secondary charger used for current budgeting and sensing.

  compatible:
    const: qcom,pmi632-charger

  reg:
    maxItems: 1

  interrupts:
    minItems: 4
    maxItems: 4

  interrupt-names:
    items:
      - const: usb-plugin
      - const: bat-ov
      - const: wdog-bark
      - const: usbin-icl-change

  io-channels:
    items:
      - description: USB input current sense voltage in uV (0.4 V/A)
      - description: USB input voltage in uV
      - description: Battery thermistor temperature in millidegrees Celsius
      - description: Charger temperature in millidegrees Celsius

  io-channel-names:
    items:
      - const: usbin_i
      - const: usbin_v
      - const: batt-therm
      - const: chg-temp

  input-current-limit-microamp:
    minimum: 500000
    maximum: 2000000

  qcom,jeita-hard-thresholds:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 2
    maxItems: 2
    items:
      maximum: 65535
    description: Cold and hot hardware comparator codes, in that order.

  monitored-battery:
    description: phandle to the simple-battery node
    $ref: /schemas/types.yaml#/definitions/phandle

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - io-channels
  - io-channel-names
  - monitored-battery
  - input-current-limit-microamp
  - qcom,jeita-hard-thresholds

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    pmic {
      #address-cells = <1>;
      #size-cells = <0>;
      #interrupt-cells = <4>;

      charger@1000 {
        compatible = "qcom,pmi632-charger";
        reg = <0x1000>;

        interrupts = <0x2 0x13 0x4 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x12 0x2 IRQ_TYPE_EDGE_BOTH>,
                     <0x2 0x16 0x1 IRQ_TYPE_EDGE_RISING>,
                     <0x2 0x13 0x7 IRQ_TYPE_EDGE_RISING>;
        interrupt-names = "usb-plugin",
                          "bat-ov",
                          "wdog-bark",
                          "usbin-icl-change";

        io-channels = <&pmi632_adc 0x07>, <&pmi632_adc 0x08>,
                      <&pmi632_adc 0x4a>, <&pmi632_adc 0x09>;
        io-channel-names = "usbin_i",
                           "usbin_v", "batt-therm", "chg-temp";

        monitored-battery = <&battery>;
        input-current-limit-microamp = <2000000>;
        qcom,jeita-hard-thresholds = <0x6894 0x15aa>;
      };
    };
