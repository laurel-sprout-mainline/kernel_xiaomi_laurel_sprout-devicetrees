%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/qcom,smb1355.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#
title: Qualcomm SMB1355 parallel charger
maintainers:
  - Vishwajith KV <vishwajithkv@users.noreply.github.com>
description: |
  I2C-attached secondary charger. The primary assigns its input-current,
  battery-current and voltage budgets through standard power-supply properties.
properties:
  compatible:
    const: qcom,smb1355
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  pinctrl-names:
    const: default
  pinctrl-0: true
required: [compatible, reg, interrupts]
additionalProperties: false
